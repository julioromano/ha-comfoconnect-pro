name: HACS

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS repository validation
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
          comment: false
