name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Lint, types and unit coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run basedpyright
      - run: uv run pytest -m 'not integration'
      - name: Publish unit coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

  tcp:
    name: Simulated Modbus TCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/integration --no-cov

  hassfest:
    name: Home Assistant metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master
